name: 热点抓取定时任务

on:
  schedule:
    # 每天 7:20 / 12:20 / 20:30 运行（北京时间）
    - cron: "20 23 * * *"    # 北京时间 7:20
    - cron: "20 4 * * *"     # 北京时间 12:20
    - cron: "30 12 * * *"    # 北京时间 20:30
  workflow_dispatch:         # 支持手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4 schedule
      
      - name: 运行热点抓取
        run: python hot_fetch.py
      
      - name: 上传生成的文件
        uses: actions/upload-artifact@v4
        with:
          name: hot_topics
          path: hot_topics.json
