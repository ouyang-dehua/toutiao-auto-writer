name: 热点抓取定时任务
concurrency:
  group: "hot-fetch"
  cancel-in-progress: true
on:
  schedule:
    - cron: "20 23 * * *"    # UTC 23:20 = 北京时间 7:20
    - cron: "20 4 * * *"     # UTC 4:20 = 北京时间 12:20
    - cron: "30 12 * * *"    # UTC 12:30 = 北京时间 20:30
  workflow_dispatch:         # 支持手动触发
jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 确保写入权限开启
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0          # 拉取完整历史
          persist-credentials: true
          ref: main

      - name: 设置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4 schedule

      - name: 运行热点抓取
        run: python hot_fetch.py

      # 同步远程最新代码，自动解决冲突
      - name: 同步远程分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main

      # ✅ 改用原生Git提交，替代容易出问题的第三方action，流程完全可控
      - name: 提交并推送到远程
        run: |
          # 只更新我们需要的热点文件
          git add hot_topics.json
          # 判断是否有变更，没有变更就跳过提交，避免空提交冲突
          if git diff --staged --quiet; then
            echo "没有文件变更，跳过提交"
            exit 0
          fi
          # 有变更就提交推送
          git commit -m "自动更新热点数据 $(date +'%Y-%m-%d %H:%M')"
          git push origin main
