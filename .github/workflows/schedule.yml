name: 热点抓取定时任务

on:
  schedule:
    # 每天 7:20 / 12:20 / 20:30 运行（北京时间）
    - cron: "20 23 * * *"    # UTC 23:20 = 北京时间 7:20
    - cron: "20 4 * * *"     # UTC 4:20 = 北京时间 12:20
    - cron: "30 12 * * *"    # UTC 12:30 = 北京时间 20:30
  workflow_dispatch:         # 支持手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 需要写入权限才能提交文件
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4 schedule

      - name: 运行热点抓取
        run: python hot_fetch.py

      - name: 提交文件回仓库
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "自动更新热点数据"
          file_pattern: hot_topics.json
          branch: main
