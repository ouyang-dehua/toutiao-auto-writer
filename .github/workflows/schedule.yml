name: 热点抓取定时任务

on:
  schedule:
    - cron: '20 7 * * *'   # 北京时间15:20
    - cron: '20 12 * * *'  # 北京时间20:20
    - cron: '30 20 * * *'  # 北京时间凌晨4:30
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 关键：添加写入权限
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 运行热点抓取
        run: python crawl_hot.py

      - name: 提交文件回仓库
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "自动更新热点数据"
          file_pattern: hot_topics.json
