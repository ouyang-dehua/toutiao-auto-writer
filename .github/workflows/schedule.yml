name: 热点抓取定时任务
on:
  schedule:
    - cron: "20 23 * * *"
    - cron: "20 4 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:

# 全局显式声明权限
permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # 确保获取完整git历史，方便提交
          fetch-depth: 0
      
      - name: 设置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4
      
      - name: 运行热点抓取
        run: python hot_fetch.py
      
      # 检查文件是否生成
      - name: 检查输出文件
        run: |
          if [ -f hot_topics.json ]; then
            echo "✅ 文件生成成功，大小：$(du -h hot_topics.json | cut -f1)"
          else
            echo "❌ hot_topics.json 文件不存在！"
            exit 1
          fi
      
      # 配置git身份（解决常见的身份认证失败问题）
      - name: 配置Git身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: 提交文件回仓库
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "自动更新热点数据"
          file_pattern: hot_topics.json
          branch: ${{ github.head_ref || github.ref_name }}
          # 明确指定提交者信息
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          # 跳过脏检查，如果文件没变化也不报错
          skip_dirty_check: true
